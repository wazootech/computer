name: verify

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm 10 on purpose: pnpm v11 dropped support for this repo's
      # package.json "pnpm.overrides" and fails --frozen-lockfile with
      # ERR_PNPM_LOCKFILE_CONFIG_MISMATCH (wazootech/computer#45).
      - name: Activate pnpm 10
        run: corepack prepare pnpm@10.34.5 --activate

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test
