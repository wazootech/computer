name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pnpm 10 on purpose: pnpm v11 dropped support for this repo's
      # package.json "pnpm.overrides" and fails --frozen-lockfile with
      # ERR_PNPM_LOCKFILE_CONFIG_MISMATCH (wazootech/computer#45).
      # action-setup must run before setup-node so the pnpm binary is on
      # PATH when setup-node's cache: pnpm looks for it.
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.34.5

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

      # The build compiles the authored app into eve's manifest (channel routes,
      # tool registry). Typecheck and unit tests cannot see that layer, and it
      # takes seconds. `agent/channels/eve.ts` refuses to resolve without a
      # trusted host, so the build runs with development values.
      - name: Build eve app
        run: pnpm run build:eve
        env:
          NODE_ENV: development
          BETTER_AUTH_SECRET: ci-only
          VERCEL_APP_CLIENT_ID: ci-only
          VERCEL_APP_CLIENT_SECRET: ci-only
