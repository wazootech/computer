name: deploy-discord-bridge

# The Discord Gateway bridge is the only part of Computer that runs outside
# Vercel: it holds a websocket on a Zo Computer service, which does not redeploy
# itself. Vercel keeps deploying the agent on push to main; this workflow does
# the same for the bridge.
on:
  push:
    branches: [main]
    paths:
      - "bridge/**"
      - "lib/discord-bridge.ts"
      - "lib/discord-mention-policy.ts"
      - "lib/discord-policy.ts"
      - "lib/discord-text.ts"
      - "lib/zo-deploy.ts"
      - "scripts/zo-deploy.ts"
      - "package.json"
      - ".github/workflows/deploy-discord-bridge.yml"
  workflow_dispatch:

concurrency:
  # Deploys are serialized, never cancelled: two overlapping restarts would race
  # on the live checkout, and a cancelled deploy would report nothing.
  group: deploy-discord-bridge
  cancel-in-progress: false

env:
  # Override with repository variables if the service or its checkout moves.
  SERVICE_LABEL: ${{ vars.ZO_BRIDGE_SERVICE || 'computer-discord-bridge' }}
  BRIDGE_DIRECTORY: ${{ vars.ZO_BRIDGE_DIRECTORY || '/home/workspace/users/etok/workspaces/wazootech/repos/computer' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check the deploy credential
        id: credential
        env:
          ZO_API_KEY: ${{ secrets.ZO_API_KEY }}
        run: |
          if [ -z "${ZO_API_KEY}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ZO_API_KEY is not set, so the bridge was not deployed. The runbook in README.md covers the token and the service."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      # The script drives api.zo.computer/mcp: it fast-forwards the live
      # checkout, restarts the service, and waits for the bridge's own ready log
      # line. A failed fast-forward stops before the restart, so the previous
      # build keeps running.
      - name: Deploy the live bridge service
        if: steps.credential.outputs.configured == 'true'
        env:
          ZO_API_KEY: ${{ secrets.ZO_API_KEY }}
        run: |
          node --experimental-strip-types scripts/zo-deploy.ts \
            --service "${SERVICE_LABEL}" \
            --dir "${BRIDGE_DIRECTORY}" \
            --expect-sha "${GITHUB_SHA}"
